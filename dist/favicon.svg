<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5090ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c040ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#40ffcc" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0d8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="17" fill="none" stroke="url(#border)" stroke-width="2.5"/>
  <!-- Corner accents -->
  <path d="M10,4 L4,4 L4,10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M90,4 L96,4 L96,10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10,96 L4,96 L4,90" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M90,96 L96,96 L96,90" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- KH text -->
  <text x="50" y="67"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="50"
    fill="url(#text)"
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="-3">KH</text>
  <!-- Subtle underline glow -->
  <rect x="22" y="72" width="56" height="1.5" rx="1" fill="url(#border)" opacity="0.6"/>
</svg>
